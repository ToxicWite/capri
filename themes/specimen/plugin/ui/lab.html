<link rel="stylesheet" href="/plugins/com.tokii.specimen-lab/ui/lab.css">
<div id="spl" class="spl">
  <div id="spl-lamp" class="spl-lamp" hidden>
    <div id="spl-hidden" class="spl-hidden"></div>
    <div class="spl-cross"></div>
    <span id="spl-mode" class="spl-mode"></span>
  </div>
  <div id="spl-pet" class="spl-pet" hidden>
    <img id="spl-pet-img" class="spl-pet-img" src="/plugins/com.tokii.specimen-lab/ui/pet.webp" alt="" draggable="false">
    <span id="spl-say" class="spl-say" hidden></span>
  </div>
  <section id="spl-cab" class="spl-cab" hidden role="dialog">
    <header class="spl-cab-head">
      <div>
        <strong id="spl-cab-title"></strong>
        <small id="spl-cab-count"></small>
      </div>
      <button id="spl-close" class="spl-btn" type="button"></button>
    </header>
    <p id="spl-hint" class="spl-hint"></p>
    <div id="spl-grid" class="spl-grid"></div>
    <footer class="spl-cab-foot">
      <button id="spl-reset" class="spl-btn spl-btn-ghost" type="button"></button>
    </footer>
  </section>
</div>
<script src="/plugins/com.tokii.specimen-lab/ui/lab.js"></script>
